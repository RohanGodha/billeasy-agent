<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#0a0d12" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var k = 'counter-copilot-theme';
          var t = localStorage.getItem(k);
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.classList.add(t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#0a0d12' : '#f7f8fa');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta
      name="description"
      content="Counter Copilot — an agentic revenue-assurance assistant for Billeasy Area Partner Managers: detect fare and revenue leakage across retail POS outlets and transit ticketing counters, catch settlement and GST compliance gaps, recommend the right Billeasy module, and draft compliant WhatsApp nudges for supervisors."
    />
    <title>Counter Copilot — Every Counter, Accounted For</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-bg text-text antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
